openapi: 3.0.3
info:
  title: DataScope API
  version: 1.0.0
  description: >-
    OpenAPI description of DataScope Express routes verified in source. Protected
    routes authenticate with a Better Auth HTTP-only session cookie, sent by
    browser clients using credentials: include. The exact cookie name is
    dependency-managed and not fixed in this repository, so it is not encoded
    as a guessed security scheme here. Better Auth's generated auth API is
    catch-all mounted; only common known operations are represented below and
    its detailed response schemas remain unverified.
servers:
  - url: http://localhost:5000
    description: Local development default; deployment URL is configured externally.
tags:
  - name: System
  - name: Authentication
  - name: Datasets
  - name: Fields
  - name: Records
  - name: Saved search
  - name: Analytics
  - name: Administration
paths:
  /:
    get:
      tags: [System]
      summary: Root service and database status
      responses:
        '200':
          description: Database connection is available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceStatus'}
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceStatus'}
  /api/health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Mongoose connection is ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '503':
          description: Mongoose connection is not ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
  /api/auth/sign-up/email:
    post:
      tags: [Authentication]
      summary: Register using email and password
      description: >-
        Better Auth handler. requestedRole is coerced to viewer unless it is
        dataAnalyst. Detailed response and validation statuses are dependency-managed
        and unverified from repository source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: {type: string}
                email: {type: string, format: email}
                password: {type: string, format: password}
                requestedRole: {type: string, enum: [viewer, dataAnalyst]}
      responses:
        default: {description: Better Auth success or error response; status codes and schema unverified.}
  /api/auth/sign-in/email:
    post:
      tags: [Authentication]
      summary: Sign in using email and password
      description: Better Auth handler; detailed response/error schema is dependency-managed and unverified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        default: {description: Better Auth success or error response; status codes and schema unverified.}
  /api/auth/sign-out:
    post:
      tags: [Authentication]
      summary: Sign out current session
      description: Better Auth handler; exact request and response behavior is dependency-managed and unverified.
      responses:
        default: {description: Better Auth success or error response; status codes and schema unverified.}
  /api/auth/get-session:
    get:
      tags: [Authentication]
      summary: Get current Better Auth session
      description: Better Auth handler; exact response schema is dependency-managed and unverified.
      responses:
        default: {description: Better Auth session/no-session response; status code and schema unverified.}
  /api/me:
    get:
      tags: [Authentication]
      summary: Get current DataScope user and permissions
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets:
    get:
      tags: [Datasets]
      summary: List datasets readable by the current user
      responses:
        '200':
          description: Dataset list.
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets:
                    type: array
                    items: {$ref: '#/components/schemas/Dataset'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Datasets]
      summary: Create dataset
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatasetInput'}
            example:
              name: Customer Directory
              slug: customer-directory
              category: Sales
              dataSource: {name: CRM, type: database}
      responses:
        '201':
          description: Dataset created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset: {$ref: '#/components/schemas/Dataset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Duplicate dataset slug.}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets/{datasetId}:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
    get:
      tags: [Datasets]
      summary: Get dataset metadata
      responses:
        '200':
          description: Dataset and whether current role can manage it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset: {$ref: '#/components/schemas/Dataset'}
                  canManage: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [Datasets]
      summary: Update dataset metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatasetPatch'}
      responses:
        '200':
          description: Updated dataset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset: {$ref: '#/components/schemas/Dataset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Duplicate dataset slug.}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Datasets]
      summary: Delete dataset and associated application documents
      responses:
        '204': {description: Dataset deleted; no response body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets/{datasetId}/fields:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
    get:
      tags: [Fields]
      summary: List dataset fields
      responses:
        '200':
          description: Field definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    items: {$ref: '#/components/schemas/DatasetField'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Fields]
      summary: Add dataset field
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatasetFieldInput'}
      responses:
        '201':
          description: Field created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field: {$ref: '#/components/schemas/DatasetField'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Duplicate field name in the dataset.}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets/{datasetId}/fields/{fieldId}:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
      - name: fieldId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
    patch:
      tags: [Fields]
      summary: Update dataset field
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatasetFieldPatch'}
      responses:
        '200':
          description: Updated field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field: {$ref: '#/components/schemas/DatasetField'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Duplicate field name in the dataset.}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Fields]
      summary: Delete dataset field definition
      responses:
        '204': {description: Field deleted; no response body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets/{datasetId}/records:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
    get:
      tags: [Records]
      summary: Search and page through dataset records
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: sort, in: query, style: form, explode: true, description: Repeat up to three sortable-field rules, e.g. revenue:desc., schema: {type: array, maxItems: 3, items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]*:(asc|desc)$'}}}
        - {name: fields, in: query, description: Comma-separated list of up to 40 defined fields., schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: qMode, in: query, description: Requires q; exact/text require advanced-search permission., schema: {type: string, enum: [partial, exact, text]}}
        - {name: filters, in: query, description: JSON array of 1–10 typed conditions combined with AND., schema: {type: string}}
      responses:
        '200':
          description: One bounded page and match totals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets/{datasetId}/records/{recordId}:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
      - name: recordId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
    get:
      tags: [Records]
      summary: Get one record within a dataset
      responses:
        '200':
          description: Record detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  record: {$ref: '#/components/schemas/Record'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets/{datasetId}/export:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
    get:
      tags: [Records]
      summary: Export up to 1000 records as JSON
      responses:
        '200':
          description: Dataset and first at most 1000 records; record document properties are flexible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset: {$ref: '#/components/schemas/Dataset'}
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/JsonExportRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/datasets/{datasetId}/export/csv:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
    post:
      tags: [Records]
      summary: Export selected or filtered records as CSV
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CsvExportRequest'}
            examples:
              selected:
                value: {mode: selected, recordIds: ['65f000000000000000000200'], fields: [companyName, status]}
              filtered:
                value: {mode: filtered, fields: [companyName, status], q: Acme, qMode: partial, filters: [{field: status, operator: equals, value: active}]}
      responses:
        '200':
          description: CSV attachment; capped at 5000 records.
          headers:
            Content-Disposition: {schema: {type: string}}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {description: More than 5000 records match the export.}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/saved-views:
    get:
      tags: [Saved search]
      summary: List owned and shared saved views
      parameters:
        - {$ref: '#/components/parameters/OptionalDatasetId'}
      responses:
        '200':
          description: At most 100 accessible views.
          content:
            application/json:
              schema:
                type: object
                properties:
                  views:
                    type: array
                    items: {$ref: '#/components/schemas/SavedView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Saved search]
      summary: Create a saved view
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewInput'}
      responses:
        '201':
          description: Saved view created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: {$ref: '#/components/schemas/SavedView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/saved-views/{viewId}:
    parameters:
      - name: viewId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
    patch:
      tags: [Saved search]
      summary: Update owned saved view
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewPatch'}
      responses:
        '200':
          description: Updated saved view.
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: {$ref: '#/components/schemas/SavedView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Saved search]
      summary: Delete owned saved view
      responses:
        '204': {description: Deleted; no response body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/search-history:
    get:
      tags: [Saved search]
      summary: List current user's recent search history
      parameters:
        - {$ref: '#/components/parameters/OptionalDatasetId'}
      responses:
        '200':
          description: Up to 50 most recent accessible search entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: {$ref: '#/components/schemas/SearchHistoryEntry'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Saved search]
      summary: Record a search configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchHistoryInput'}
      responses:
        '201':
          description: Search history entry created; resultCount is stored as zero.
          content:
            application/json:
              schema:
                type: object
                properties:
                  history: {$ref: '#/components/schemas/SearchHistoryEntry'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/analytics:
    get:
      tags: [Analytics]
      summary: Get analytics scoped to readable datasets
      responses:
        '200':
          description: Aggregated records and recorded search metrics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analytics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/admin/users:
    get:
      tags: [Administration]
      summary: List users
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/admin/users/{userId}/role:
    patch:
      tags: [Administration]
      summary: Set a user's role to Viewer or Data Analyst
      parameters:
        - name: userId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ObjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: {type: string, enum: [viewer, dataAnalyst]}
      responses:
        '200':
          description: Role changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: {$ref: '#/components/schemas/ObjectId'}
                  role: {type: string, enum: [viewer, dataAnalyst]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Administrator role cannot be changed through this endpoint.}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/admin/analytics:
    get:
      tags: [Administration]
      summary: Get global user, dataset, and record counts
      responses:
        '200':
          description: Global counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: {type: integer}
                  datasets: {type: integer}
                  records: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/admin/system-config:
    get:
      tags: [Administration]
      summary: Read application name and role list
      responses:
        '200':
          description: Read-only configuration summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  application: {type: string, enum: [DataScope]}
                  roles:
                    type: array
                    items: {type: string, enum: [administrator, dataAnalyst, viewer]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/admin/datasets/{datasetId}/permissions:
    get:
      tags: [Administration]
      summary: List user grants for a dataset
      parameters:
        - {$ref: '#/components/parameters/DatasetId'}
      responses:
        '200':
          description: Dataset grants with user display data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: {$ref: '#/components/schemas/DatasetGrant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/admin/datasets/{datasetId}/permissions/{userId}:
    parameters:
      - {$ref: '#/components/parameters/DatasetId'}
      - name: userId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
    put:
      tags: [Administration]
      summary: Set read/export grants for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              additionalProperties: false
              properties:
                permissions:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, enum: [read, export]}
      responses:
        '200':
          description: Grant saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantAssignment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Administration]
      summary: Revoke user grant for a dataset
      responses:
        '204': {description: Grant deleted or already absent; no response body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
components:
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    OptionalDatasetId:
      name: datasetId
      in: query
      required: false
      schema: {$ref: '#/components/schemas/ObjectId'}
  responses:
    BadRequest:
      description: Invalid parameter or request body.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Role permission or dataset grant is insufficient.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 65f000000000000000000010
    Error:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
    ServiceStatus:
      type: object
      properties:
